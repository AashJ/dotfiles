onboarding = false

[theme]
name = "catppuccin"

# tmux-style pane workflow
auto_switch = false
[keys]
prefix = "ctrl+b"
detach = "prefix+d"
reload_config = "prefix+shift+r"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+q"
zoom = "prefix+m"
resize_mode = "prefix+r"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_right = "l"
last_pane = "ctrl+\\"

# vim-tmux-navigator equivalent for Herdr.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+/"
type = "plugin_action"
command = "herdr-navigator.open"
description = "search Herdr"

[ui]
mouse_capture = true
copy_on_select = true
